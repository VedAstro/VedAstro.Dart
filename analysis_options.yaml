# Analysis rules for the VedAstro Dart SDK.
#
# This file is deliberately self-contained rather than including `package:lints`.
# A package include makes `dart analyze` depend on whichever `lints` version the
# resolver picks, and newer releases of it require a newer SDK than the 3.0 floor
# this package declares. Owning the list keeps the declared floor honest and the
# analysis identical on every supported SDK.
#
# The rules are the ones this package actively relies on being clean, so a
# regression is caught by `dart analyze` rather than by a user.

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # A public API without documentation is a bug in this package, not a style nit.
    public_member_api_docs: warning
  exclude:
    # Generated from the server's metadata; its shape is the generator's business.
    - lib/src/generated/**

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_print
    - cancel_subscriptions
    - close_sinks
    - comment_references
    - directives_ordering
    - prefer_final_locals
    - prefer_single_quotes
    - sort_constructors_first
    - unawaited_futures
    - unnecessary_await_in_return
    - use_super_parameters
