name: vedastro
description: >-
  Official Dart client for the VedAstro Vedic astrology API. 684 calculations,
  type-safe enums, and an HTTP transport that works on any server: Shelf, Dart
  Frog, Cloud Run, a plain VM, or behind your own framework.
version: 1.0.0
repository: https://github.com/VedAstro/VedAstro.Dart
homepage: https://vedastro.org
issue_tracker: https://github.com/VedAstro/VedAstro.Dart/issues
documentation: https://github.com/VedAstro/VedAstro.Dart#readme

environment:
  # Lower bound is the first SDK with the features this package uses: enhanced enums
  # and class modifiers. CI runs the suite on 3.0 and 3.3 to prove it really holds.
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  # Deliberately not `^1.2.0`: that floor requires SDK 3.2, which would make the
  # declared 3.0 floor below a lie. `>=1.0.0 <2.0.0` lets the resolver pick the
  # newest build the running SDK supports - 1.1.0 on Dart 3.0, 1.2.x on 3.3, and the
  # current release on stable - so one pubspec stays honest across the whole range.
  http: ">=1.0.0 <2.0.0"

dev_dependencies:
  # No `lints` dependency on purpose: analysis_options.yaml carries its own curated
  # rule list, so `dart analyze` behaves identically on every supported SDK instead of
  # depending on which lints version the resolver happens to pick. It also lets the
  # declared 3.0 floor stay honest, since newer `lints` releases require a newer SDK.
  test: ^1.25.0
